# Automatic Analysis settings; values here override the ones set in the UI

# Tests are indexed once, as tests: listed under sonar.tests and kept out of
# the main sources, so production-only rules skip them
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=codenerix/**/tests/**

# Vendored third-party libraries (not ours to fix, only noise), and the tests
# already indexed through sonar.tests above
sonar.exclusions=codenerix/static/codenerix/lib/**,codenerix/**/tests/**

# Matches requires-python in pyproject.toml, so rules target the right syntax
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
