name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancela runs antiguos del mismo ref si llega uno nuevo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv call must match uv.lock
env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        # One cache key per job: they all ran on the same system Python, raced
        # to save a single key and logged "Unable to reserve cache"
        with:
          cache-suffix: lint
      - name: Sync (dev)
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check .
      - name: ruff format --check
        run: uv run --locked ruff format --check .

  types:
    name: Type check (mypy + basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-suffix: types
      - name: Sync (dev)
        run: uv sync --locked
      - name: mypy
        run: uv run --locked mypy codenerix
      - name: basedpyright
        run: uv run --locked basedpyright codenerix

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-suffix: py${{ matrix.python-version }}
      - name: Sync (dev)
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: pytest
        # Necesita DJANGO_SETTINGS_MODULE; lo fijamos en
        # [tool.pytest.ini_options] del pyproject (igual que en channels).
        run: uv run --locked pytest
